name: Sonda de fontes
on:
  push:
    paths: [".github/workflows/sonda.yml"]
  workflow_dispatch:
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - name: Testa fontes
        run: |
          probe() {
            echo "=== $1"
            curl -sS -L --max-time 60 -A "Mozilla/5.0 gestora-ficticia" -o /tmp/out -w "status=%{http_code} size=%{size_download} type=%{content_type}\n" "$2" || echo "curl falhou"
            head -c 600 /tmp/out | tr -d '\000'; echo; echo
          }
          probe sgs12 "https://api.bcb.gov.br/dados/serie/bcdata.sgs.12/dados/ultimos/5?formato=json"
          probe sgs432 "https://api.bcb.gov.br/dados/serie/bcdata.sgs.432/dados/ultimos/3?formato=json"
          probe sgs1 "https://api.bcb.gov.br/dados/serie/bcdata.sgs.1/dados/ultimos/5?formato=json"
          probe sgs7 "https://api.bcb.gov.br/dados/serie/bcdata.sgs.7/dados/ultimos/5?formato=json"
          probe sgs433 "https://api.bcb.gov.br/dados/serie/bcdata.sgs.433/dados/ultimos/3?formato=json"
          probe sgs11 "https://api.bcb.gov.br/dados/serie/bcdata.sgs.11/dados/ultimos/3?formato=json"
          probe focus "https://olinda.bcb.gov.br/olinda/servico/Expectativas/versao/v1/odata/ExpectativasMercadoAnuais?%24top=4&%24filter=Indicador%20eq%20'IPCA'&%24orderby=Data%20desc&%24format=json"
          probe ptax "https://olinda.bcb.gov.br/olinda/servico/PTAX/versao/v1/odata/CotacaoMoedaPeriodo(moeda=@moeda,dataInicial=@dataInicial,dataFinalCotacao=@dataFinalCotacao)?@moeda='USD'&@dataInicial='09-20-2026'&@dataFinalCotacao='10-01-2026'&%24format=json&%24top=3"
          probe yahoo "https://query1.finance.yahoo.com/v8/finance/chart/%5EBVSP?range=5d&interval=1d"
          probe yahoo_bova "https://query2.finance.yahoo.com/v8/finance/chart/BOVA11.SA?range=5d&interval=1d"
          probe stooq "https://stooq.com/q/d/l/?s=%5Ebvp&i=d"
          probe b3_ibov "https://sistemaswebb3-listados.b3.com.br/indexStatisticsProxy/IndexCall/GetPortfolioDay/eyJpbmRleCI6IklCT1YiLCJsYW5ndWFnZSI6InB0LWJyIiwieWVhciI6IjIwMjYifQ=="
          probe b3_cotahist "https://bvmf.bmfbovespa.com.br/InstDados/SerHist/COTAHIST_D30092026.ZIP"
          echo "=== tesouro (so cabecalho e tamanho)"
          curl -sS -L --max-time 120 -o /tmp/td.csv -w "status=%{http_code} size=%{size_download}\n" "https://www.tesourotransparente.gov.br/ckan/dataset/df56aa42-484a-4a59-8184-7676580c81e3/resource/796d2059-14e9-44e3-80c9-2d9e30b405c1/download/PrecoTaxaTesouroDireto.csv" || echo falhou
          head -3 /tmp/td.csv; grep -c . /tmp/td.csv; grep "/2026" /tmp/td.csv | sort -t';' -k3 | tail -3
          echo "=== cvm informe diario"
          curl -sS -I --max-time 60 "https://dados.cvm.gov.br/dados/FI/DOC/INF_DIARIO/DADOS/inf_diario_fi_202609.zip" | head -8
