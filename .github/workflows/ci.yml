name: CI

# Barra decisões e políticas inválidas antes do merge (o PR diário do agente passa por aqui).
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["dados/**", "cenarios/*/dados/**"]

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pytest
      - name: Testes do motor
        run: python -m pytest -q
      - name: Políticas e decisões pendentes
        run: python -m gestora validar
      - name: Ensaio do próximo dia de cada cenário com as decisões deste PR (sem rede)
        run: |
          for c in $(python -m gestora cenarios --ids); do
            python -m gestora --cenario "$c" fechamento --sem-extracao --proximo
          done
          git checkout -- dados cenarios && git clean -fdq dados cenarios
      - name: Site monta com todos os painéis
        run: python -m gestora site _site
