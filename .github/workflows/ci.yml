name: CI

# Barra código, políticas e diretrizes que quebram o motor antes do merge.
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["dados/**", "cenarios/*/dados/**"]

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pytest
      - name: Testes do motor
        run: python -m pytest -q
      - name: Políticas e decisões pendentes
        run: python -m gestora validar
      - name: Ensaio do próximo dia de cada cenário com as diretrizes deste PR (sem rede)
        run: |
          # se o motor mudou de versão, o fechamento refaz o histórico antes; o auditar confere todas as verificações
          for c in $(python -m gestora cenarios --ids); do
            python -m gestora --cenario "$c" fechamento --sem-extracao --proximo
          done
          python -m gestora auditar --todos
          python -m gestora site _site
          git checkout -- dados cenarios && git clean -fdq dados cenarios
