name: CI

# Barra decisões e políticas inválidas antes do merge (o PR diário do agente passa por aqui).
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["dados/**"]

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pytest
      - name: Testes do motor
        run: python -m pytest -q
      - name: Políticas e decisões pendentes
        run: python -m gestora validar
      - name: Ensaio do próximo fechamento com as decisões deste PR (sem rede)
        run: |
          if [ -f dados/estado.json ]; then
            proximo=$(python -c "import json;from datetime import date;from gestora import calendario as c;print(c.proximo_dia_util(date.fromisoformat(json.load(open('dados/estado.json'))['ultima_data'])))")
            python -m gestora fechamento --sem-extracao --data "$proximo"
            git checkout -- dados && git clean -fdq dados
          fi
