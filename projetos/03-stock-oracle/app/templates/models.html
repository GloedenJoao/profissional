{% extends "base.html" %}

{% block content %}
<section class="page-header">
  <div>
    <h1>Catalogo de modelos</h1>
    <p>Estrategias Python versionadas e executaveis localmente.</p>
  </div>
  <a class="button primary" href="/runs/new">Executar</a>
</section>

<section class="model-grid">
  {% for model in models %}
    <article class="model-card">
      <div>
        <span class="eyebrow">{{ model.slug }}</span>
        <h2><a href="/models/{{ model.id }}">{{ model.name }}</a></h2>
        <p>{{ model.description }}</p>
      </div>
      <strong>{{ model.versions|length }} versoes</strong>
    </article>
  {% endfor %}
</section>
{% endblock %}
