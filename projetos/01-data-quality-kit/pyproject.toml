[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dq-kit"
version = "0.1.0"
description = "Validação de pipelines de dados em 3 camadas (pré, durante, pós) com tabela de controle, diagnóstico de duplicidade e servidor MCP."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0"]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
spark = ["pyspark>=3.5"]
dev = ["pytest>=8"]

[project.scripts]
dq-kit = "dq_kit.cli:main"
dq-kit-mcp = "dq_kit.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
