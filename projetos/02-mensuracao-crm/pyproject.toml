[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mensuracao-crm"
version = "0.1.0"
description = "Mensuração de campanhas de aquisição: incrementalidade com grupo de controle x atribuição last-touch, em SQL."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mensuracao = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
